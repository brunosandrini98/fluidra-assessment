[project]
name = "pool-qa"
version = "0.1.0"
description = "Multi-agent question answering over pool equipment documents"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "anthropic>=1.6.0",
    "bm25s>=0.3.11",
    "fastapi>=0.141.1",
    "langchain>=1.4.0",
    "langchain-anthropic>=1.7.2",
    "langgraph>=1.2.11",
    "lingua-language-detector>=2.2.0",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "pypdf>=6.18.1",
    "pystemmer>=3.1.0",
    "uvicorn>=0.53.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "ruff>=0.16.8",
]

[build-system]
requires = ["uv_build>=0.11.6,<0.12.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
extend-select = ["I"]
